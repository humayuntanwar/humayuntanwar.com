<head>

<style>
/* A portrait page. The photo's studio backdrop becomes the page itself; beside it, a name, four lines and a signature. */
:root{--bg:#E9DEDA;--ink:#141211;--soft:#6F625D;--rule:rgba(20,18,17,.16);
  --display:'Bodoni Moda','Didot','Bodoni MT',Georgia,serif;--text:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--hand:'La Belle Aurore','Segoe Script','Bradley Hand',cursive;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--text);-webkit-font-smoothing:antialiased}
.page{min-height:100vh;min-height:100svh;display:grid;grid-template-columns:minmax(0,46fr) minmax(0,54fr)}
.portrait{position:relative;min-height:100svh;overflow:hidden}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.portrait::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 62%,var(--bg) 100%),linear-gradient(180deg,rgba(233,222,218,.55) 0%,transparent 16%)}
.body{display:flex;flex-direction:column;justify-content:center;gap:clamp(28px,5vh,56px);padding:clamp(40px,8vh,96px) max(24px,6vw,env(safe-area-inset-right,0px)) clamp(40px,8vh,96px) clamp(24px,4vw,64px);min-width:0}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(56px,7.6vw,132px);line-height:.88;letter-spacing:-.02em}
h1 i{font-style:italic}
.now{margin:18px 0 0;font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}
ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink);max-width:640px}
li{display:grid;grid-template-columns:8.2em minmax(0,1fr);gap:20px;align-items:baseline;padding:15px 0;border-bottom:1px solid var(--rule);font-size:clamp(16px,1.35vw,19px);color:var(--soft)}
li time{font-size:.82em;font-weight:500;letter-spacing:.08em;font-variant-numeric:tabular-nums;white-space:nowrap}
li span b{font-weight:500;color:var(--ink)}
li.cur{color:var(--ink)} li.cur span b{font-weight:600}
li.cur time::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink);margin-right:9px;vertical-align:1px}
.sig{font-family:var(--hand);font-size:clamp(44px,4.6vw,68px);line-height:1;color:var(--ink);transform:rotate(-4deg);transform-origin:left;margin:-4px 0 0}
.menu{display:flex;flex-wrap:wrap;margin:-10px -10px 0;font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.menu a{display:inline-flex;align-items:center;min-height:44px;padding:0 10px;color:var(--soft);text-decoration:none}
.menu a:hover,.menu a[aria-current]{color:var(--ink)}
.menu a[aria-current]{text-decoration:underline;text-underline-offset:5px}
.menu a:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}
@media (max-width:760px){
  .page{grid-template-columns:minmax(0,1fr)}
  .portrait{min-height:0;height:62svh}
  .portrait::after{background:linear-gradient(180deg,transparent 70%,var(--bg) 100%)}
  .body{padding:8px 22px 36px;gap:28px;justify-content:flex-start}
  h1{font-size:clamp(52px,16vw,76px);margin-top:-34px;position:relative}
  li{grid-template-columns:6.6em minmax(0,1fr);gap:14px;padding:13px 0}
}
</style>
</head>
<body>
<main class="page">
  <div class="portrait"><img src="../me.jpg" alt="Humayun Tanwar" width="900" height="1200"></div>
  <div class="body">
    <header>
      <h1>Humayun<br><i>Tanwar</i></h1>
      <p class="now">Dubai · Payments</p>
    </header>
    <ol>
      <li class="cur"><time>2026 – Now</time><span><b>EMEA Lead, Integrations</b> · NomuPay</span></li>
      <li><time>2022 – 2026</time><span><b>Integration Lead</b> · NomuPay</span></li>
      <li><time>2020 – 2022</time><span><b>Integrations &amp; Platforms Lead</b> · Magnati</span></li>
      <li><time>2018 – 2020</time><span><b>Android Developer</b> · Access Group</span></li>
    </ol>
    <p class="sig" aria-hidden="true">Humayun</p>
    <nav class="menu" aria-label="Find me">
      <a href="/">Story</a>
      <a href="/me/" aria-current="page">Me</a>
      <a href="/letter/">Letter</a>
      <a href="/window/">Window</a>
      <a href="mailto:humayuntanwar@gmail.com">Email</a>
      <a href="https://www.linkedin.com/in/humayuntanwar" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://github.com/humayuntanwar" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </div>
</main>
</body>
</html>
