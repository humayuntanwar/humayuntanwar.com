<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap">
<style>
/* One window. The sky is computed from the sun's real position over Dubai; the skyline rises when you arrive. */
:root{--glass:#EEF1FF;--glass-shadow:rgba(5,8,25,.55);--sill:#0C0D12;--sill-ink:#E9E6DF;--sill-soft:#9A978F;--serif:'Literata',Georgia,'Times New Roman',serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#0A1030}
body{font-family:var(--serif);color:var(--glass);-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.frame{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 0 10px var(--sill),inset 0 0 0 11px rgba(255,255,255,.08),inset 0 0 140px rgba(0,0,0,.28);background:linear-gradient(115deg,rgba(255,255,255,.07) 0%,transparent 22%,transparent 60%,rgba(255,255,255,.04) 78%,transparent 100%)}
.glass{position:fixed;left:max(34px,6vw,env(safe-area-inset-left,0px));right:max(34px,6vw);top:max(44px,9vh,env(safe-area-inset-top,0px));pointer-events:none;max-width:22em;font-size:clamp(22px,3.3vw,44px);line-height:1.22;letter-spacing:-.01em;color:var(--glass);text-shadow:0 1px 18px var(--glass-shadow);transition:color 1.2s}
.glass p{margin:0 0 .5em;opacity:0;transform:translateY(8px);transition:opacity 1.4s ease,transform 1.4s ease}
.glass p.on{opacity:1;transform:none}
.glass p:last-child{font-style:italic;margin-top:.9em}
.sill{position:fixed;left:0;right:0;bottom:0;background:var(--sill);color:var(--sill-ink);border-top:1px solid rgba(255,255,255,.1);box-shadow:0 -10px 30px rgba(0,0,0,.35);display:flex;justify-content:space-between;align-items:center;gap:8px 28px;flex-wrap:wrap;padding:10px max(22px,4vw,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(22px,4vw,env(safe-area-inset-left,0px))}
.who{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.who b{font-weight:500;font-size:19px;letter-spacing:-.01em}
.who span{font-size:14px;color:var(--sill-soft);font-variant-numeric:tabular-nums}
.sill nav{display:flex;flex-wrap:wrap;gap:0 4px;margin:0 -10px}
.sill a{display:inline-flex;align-items:center;min-height:44px;padding:0 10px;color:var(--sill-ink);font-size:15px;text-decoration:underline;text-decoration-color:rgba(233,230,223,.35);text-underline-offset:4px}
.sill a:hover{text-decoration-color:var(--sill-ink)}
.sill a[aria-current]{text-decoration-color:var(--sill-ink);text-decoration-thickness:2px}
.sill a:focus-visible{outline:2px solid var(--sill-ink);outline-offset:-4px}
.hint{position:fixed;right:max(26px,4vw);top:max(24px,4vh);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--glass);opacity:.6;pointer-events:none;transition:opacity 1s,color 1.2s;text-shadow:0 1px 10px var(--glass-shadow)}
.hint.gone{opacity:0}
@media (max-width:640px){.glass{font-size:clamp(21px,6.2vw,30px);right:24px}.hint{display:none}.who b{font-size:17px}.sill a{font-size:14px;padding:0 8px}.sill nav{margin:0 -8px}}
@media (prefers-reduced-motion:reduce){.glass p{transition:none}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="frame" aria-hidden="true"></div>

<main class="glass">
  <p>A lifetime ago, this skyline was sand.</p>
  <p>Someone decided to build anyway.</p>
  <p>I moved here to do the same.</p>
  <p>I'm Humayun. I make payments go live.</p>
</main>
<span class="hint" id="hint">Drag the sky to travel the day</span>

<footer class="sill">
  <div class="who"><b>Humayun Tanwar</b><span id="clock">Dubai</span></div>
  <nav aria-label="Find me">
    <a href="/">Story</a>
    <a href="/me/">Me</a>
    <a href="/letter/">Letter</a>
    <a href="/window/" aria-current="page">Window</a>
    <a href="mailto:humayuntanwar@gmail.com">Email</a>
    <a href="https://www.linkedin.com/in/humayuntanwar" target="_blank" rel="noopener">LinkedIn</a>
    <a href="https://github.com/humayuntanwar" target="_blank" rel="noopener">GitHub</a>
  </nav>
</footer>

<script>
(function(){
  const cv = document.getElementById('sky'), c = cv.getContext('2d');
  const root = document.documentElement, clock = document.getElementById('clock'), hint = document.getElementById('hint');
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const LAT = 25.2048 * Math.PI / 180, LON = 55.2708;
  let W = 0, H = 0, base = 0, far = [], mid = [], near = [], hero = null, stars = [], winMid = null, winNear = null, beacons = [];

  // ---- time: real Dubai time plus a temporary offset while the visitor drags the sky
  let offset = 0, dragging = null, returnAt = 0;
  const q = new URLSearchParams(location.search).get('h');
  if (q !== null && !isNaN(+q)) { const d = new Date(), cur = (d.getUTCHours() + 4 + d.getUTCMinutes() / 60) % 24; offset = ((+q - cur) * 3600e3); }
  const fixed = q !== null;
  const nowDate = () => new Date(Date.now() + offset);

  // ---- where the sun is over Dubai right now
  function sun(d){
    const N = Math.floor((d - Date.UTC(d.getUTCFullYear(), 0, 0)) / 864e5);
    const hrs = d.getUTCHours() + d.getUTCMinutes() / 60 + d.getUTCSeconds() / 3600;
    const decl = 23.44 * Math.PI / 180 * Math.sin(2 * Math.PI * (284 + N) / 365);
    const B = 2 * Math.PI * (N - 81) / 364, eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
    let ha = 15 * (hrs + LON / 15 + eot / 60 - 12); ha = ((ha + 540) % 360) - 180;
    const e = Math.asin(Math.sin(LAT) * Math.sin(decl) + Math.cos(LAT) * Math.cos(decl) * Math.cos(ha * Math.PI / 180));
    return { e: e * 180 / Math.PI, ha };
  }

  // ---- sky colours by sun elevation: [elevation, top, middle, horizon]
  const K = [
    [-90, [4,6,18],    [8,13,40],    [16,22,62]],
    [-18, [5,7,22],    [10,16,48],   [20,28,74]],
    [-8,  [10,18,56],  [34,44,100],  [118,78,112]],
    [-2,  [26,40,104], [150,92,110], [244,150,90]],
    [3,   [52,92,160], [222,150,112],[252,196,128]],
    [10,  [66,128,198],[168,196,222],[246,222,180]],
    [30,  [72,142,214],[158,198,232],[232,224,204]],
    [90,  [64,134,210],[166,204,236],[236,228,208]]
  ];
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const rgb = (a, al) => al === undefined ? `rgb(${a[0] | 0},${a[1] | 0},${a[2] | 0})` : `rgba(${a[0] | 0},${a[1] | 0},${a[2] | 0},${al})`;
  const cl = (x) => Math.max(0, Math.min(1, x));
  function palette(e){
    let i = 0; while (i < K.length - 2 && e > K[i + 1][0]) i++;
    const t = cl((e - K[i][0]) / (K[i + 1][0] - K[i][0]));
    return { top: mix(K[i][1], K[i + 1][1], t), mid: mix(K[i][2], K[i + 1][2], t), hor: mix(K[i][3], K[i + 1][3], t) };
  }

  // ---- the skyline
  let seed = 20;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  function row(n, wMin, wMax, hMin, hMax, cluster, f){
    const out = []; let x = -0.03;
    while (x < 1.03) {
      const w = (wMin + rnd() * (wMax - wMin)) * f;
      const boost = (W < 700 ? 0.68 : 1) * 0.55 + (W < 700 ? 0.68 : 1) * cluster * Math.exp(-Math.pow((x - 0.62) / 0.24, 2));
      out.push({ x, w: w * (0.82 + rnd() * 0.3), h: (hMin + rnd() * (hMax - hMin)) * boost, type: Math.floor(rnd() * 4), delay: rnd() * 1.3, dur: 0.9 + rnd() * 0.9 });
      x += w * (0.55 + rnd() * 0.5);
    }
    return out;
  }
  function build(){
    seed = 20;
    const f = Math.max(1, Math.min(2.4, 980 / W));
    far = row(0, 0.016, 0.04, 0.05, 0.2, 0.9, f);
    mid = row(0, 0.028, 0.06, 0.07, 0.27, 1.0, f);
    near = row(0, 0.05, 0.1, 0.04, 0.13, 0.35, f);
    mid.push({ x: 0.27, w: 0.03 * f, h: W < 700 ? 0.25 : 0.36, type: 3, delay: 0.5, dur: 1.6 }, { x: 0.27 + 0.036 * f, w: 0.03 * f, h: W < 700 ? 0.21 : 0.31, type: 3, delay: 0.7, dur: 1.6 });
    hero = { x: W < 700 ? 0.72 : 0.66, h: Math.min(W < 700 ? 0.44 : 0.7, (base - H * 0.08) / H), delay: 0.9, dur: 2.6 };
    stars = Array.from({ length: 240 }, () => ({ x: rnd(), y: rnd() * 0.8, r: 0.4 + rnd() * 1.1, p: rnd() * 6.28, s: 0.6 + rnd() * 1.6 }));
    // lit windows, drawn once
    const lights = (list, isMid) => {
      const o = document.createElement('canvas'); o.width = cv.width; o.height = cv.height;
      const g = o.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
      const cols = ['#FFD9A0', '#FFE8C2', '#FFCF8A', '#CFE3FF'];
      list.forEach((b) => {
        const bx = b.x * W, bw = b.w * W, bh = b.h * H, sx = 5, sy = 7;
        for (let y = base - bh + 8; y < base - 4; y += sy) for (let x = bx + 3; x < bx + bw - 4; x += sx) {
          if (rnd() < 0.3) { g.globalAlpha = 0.35 + rnd() * 0.6; g.fillStyle = cols[Math.floor(rnd() * cols.length)]; g.fillRect(x, y, 2, 3); }
        }
      });
      if (isMid) { // the tower: a seam of light up its core
        const hx = hero.x * W, hh = hero.h * H;
        for (let y = base - hh * 0.84; y < base - 4; y += 6) { const t = 1 - (base - y) / hh, hw = hh * 0.07 * Math.pow(t, 1.15); for (let x = hx - hw + 2; x < hx + hw - 2; x += 5) if (rnd() < 0.42) { g.globalAlpha = 0.4 + rnd() * 0.6; g.fillStyle = cols[Math.floor(rnd() * 3)]; g.fillRect(x, y, 2, 3); } }
      }
      return o;
    };
    winMid = lights(mid, true); winNear = lights(near, false);
    beacons = mid.filter((b) => b.h > (W < 700 ? 0.17 : 0.24)).map((b) => ({ x: (b.x + b.w / 2) * W, y: base - b.h * H - 3, p: rnd() * 6 }));
  }
  const ease = (t) => 1 - Math.pow(1 - cl(t), 3);
  function tower(b, g){
    const x = b.x * W, w = b.w * W, h = b.h * H * g, top = base - h;
    c.beginPath();
    if (b.type === 1) { c.rect(x, top + h * 0.12, w, h); c.rect(x + w * 0.22, top, w * 0.56, h * 0.14); c.rect(x + w * 0.48, top - h * 0.1, 1.5, h * 0.1); }
    else if (b.type === 2) { c.moveTo(x, base); c.lineTo(x, top + h * 0.14); c.lineTo(x + w / 2, top); c.lineTo(x + w, top + h * 0.14); c.lineTo(x + w, base); }
    else if (b.type === 3) { c.moveTo(x, base); c.lineTo(x, top + h * 0.2); c.lineTo(x + w, top); c.lineTo(x + w, base); }
    else c.rect(x, top, w, h);
    c.fill();
  }
  function heroTower(g){
    const hx = hero.x * W, hh = hero.h * H * g, bw = hero.h * H * 0.07, steps = 11;
    c.beginPath(); c.moveTo(hx - bw, base);
    for (let i = 0; i <= steps; i++) { const t = i / steps, y = base - hh * 0.86 * t, w0 = bw * Math.pow(1 - t, 1.15) + 1.2, w1 = bw * Math.pow(1 - (i + 1) / steps, 1.15) + 1.2; c.lineTo(hx - w0, y); if (i < steps) c.lineTo(hx - (i % 2 ? w0 : w1 + (w0 - w1) * 0.35), y - hh * 0.86 / steps * 0.02); }
    c.lineTo(hx - 0.9, base - hh); c.lineTo(hx + 0.9, base - hh);
    for (let i = steps; i >= 0; i--) { const t = i / steps, y = base - hh * 0.86 * t, w0 = bw * Math.pow(1 - t, 1.15) + 1.2; c.lineTo(hx + w0 * (i % 3 === 0 ? 1 : 0.86), y); }
    c.lineTo(hx + bw, base); c.closePath(); c.fill();
  }

  // ---- size
  let dpr = 1;
  function size(){
    dpr = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const sill = document.querySelector('.sill').offsetHeight; base = H - sill - Math.max(18, H * 0.035);
    build();
  }

  // ---- draw
  const t0 = performance.now(); let lastClock = '';
  function frame(now){
    requestAnimationFrame(frame);
    if (!dragging && !fixed && offset !== 0 && now > returnAt) { offset *= 0.9; if (Math.abs(offset) < 30e3) offset = 0; }
    const d = nowDate(), s = sun(d), e = s.e, P = palette(e), tt = (now - t0) / 1000;
    const night = cl((-e + 1) / 7), rise = (b) => reduce ? 1 : ease((tt - b.delay) / b.dur);

    const g = c.createLinearGradient(0, 0, 0, base);
    g.addColorStop(0, rgb(P.top)); g.addColorStop(0.58, rgb(P.mid)); g.addColorStop(1, rgb(P.hor));
    c.fillStyle = g; c.fillRect(0, 0, W, H);

    const sa = cl((-e - 5) / 9);
    if (sa > 0) for (const st of stars) { c.globalAlpha = sa * (0.45 + 0.55 * Math.sin(st.p + tt * st.s)) * (1 - st.y * 0.7); c.fillStyle = '#fff'; c.beginPath(); c.arc(st.x * W, st.y * base, st.r, 0, 6.3); c.fill(); }
    c.globalAlpha = 1;

    if (e > -9) { // the sun and its glow
      const sx = W * (0.5 + s.ha / 200), sy = base - (e / 90) * base * 1.15, low = cl(1 - e / 14);
      const R = Math.max(W, H) * (0.3 + 0.35 * low), gl = c.createRadialGradient(sx, sy, 0, sx, sy, R);
      const warm = mix([255, 252, 240], [255, 170, 90], low), a = cl((e + 9) / 9);
      gl.addColorStop(0, rgb(warm, 0.85 * a)); gl.addColorStop(0.12, rgb(warm, 0.38 * a)); gl.addColorStop(1, rgb(warm, 0));
      c.fillStyle = gl; c.fillRect(0, 0, W, base);
      if (e > -1.5) { c.fillStyle = rgb(mix([255, 255, 248], [255, 214, 150], low)); c.beginPath(); c.arc(sx, sy, Math.max(10, H * 0.022), 0, 6.3); c.fill(); }
    }

    const dark = [9, 11, 24];
    c.fillStyle = rgb(mix(P.hor, dark, 0.3 + 0.25 * night)); far.forEach((b) => tower(b, rise(b)));
    const hz = c.createLinearGradient(0, base - H * 0.3, 0, base); hz.addColorStop(0, rgb(P.hor, 0)); hz.addColorStop(1, rgb(P.hor, 0.55 - 0.3 * night));
    c.fillStyle = hz; c.fillRect(0, base - H * 0.3, W, H * 0.3);
    c.fillStyle = rgb(mix(P.hor, dark, 0.58 + 0.25 * night)); mid.forEach((b) => tower(b, rise(b)));
    c.fillStyle = rgb(mix(P.hor, dark, 0.66 + 0.22 * night)); heroTower(rise(hero));
    const lit = night * (reduce ? 1 : cl((tt - 3.2) / 1.6));
    if (lit > 0) { c.globalAlpha = lit; c.drawImage(winMid, 0, 0, W, H); c.globalAlpha = 1; }
    c.fillStyle = rgb(mix(P.hor, dark, 0.86 + 0.1 * night)); near.forEach((b) => tower(b, rise(b)));
    if (lit > 0) { c.globalAlpha = lit * 0.9; c.drawImage(winNear, 0, 0, W, H); c.globalAlpha = 1; }
    c.fillRect(0, base, W, H - base);
    if (lit > 0.3) { // aircraft warning lights
      c.fillStyle = '#FF4B3A';
      [{ x: hero.x * W, y: base - hero.h * H - 2, p: 0 }].concat(beacons).forEach((bc) => { c.globalAlpha = lit * (0.25 + 0.75 * Math.pow(Math.max(0, Math.sin(tt * 2.2 + bc.p)), 6)); c.beginPath(); c.arc(bc.x, bc.y, 2, 0, 6.3); c.fill(); });
      c.globalAlpha = 1;
    }

    const lum = (0.299 * P.mid[0] + 0.587 * P.mid[1] + 0.114 * P.mid[2]) / 255, day = lum > 0.56;
    root.style.setProperty('--glass', day ? '#0E1730' : '#EEF1FF');
    root.style.setProperty('--glass-shadow', day ? 'rgba(255,255,255,.55)' : 'rgba(5,8,25,.6)');
    const label = 'Dubai · ' + new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Dubai', hour: 'numeric', minute: '2-digit' }).format(d).toLowerCase() + (offset && !fixed ? ' · not now' : '');
    if (label !== lastClock) { clock.textContent = label; lastClock = label; }
  }

  // ---- drag the sky to travel through the day; let go and it drifts back to now
  cv.addEventListener('pointerdown', (ev) => { dragging = { x: ev.clientX, o: offset }; hint.classList.add('gone'); try { cv.setPointerCapture(ev.pointerId); } catch (_) {} });
  cv.addEventListener('pointermove', (ev) => { if (dragging) offset = dragging.o + (ev.clientX - dragging.x) / W * 24 * 3600e3; });
  const end = () => { if (dragging) { dragging = null; returnAt = performance.now() + 1400; } };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);

  size(); window.addEventListener('resize', size);
  requestAnimationFrame(frame);
  document.querySelectorAll('.glass p').forEach((p, i) => setTimeout(() => p.classList.add('on'), reduce ? 0 : 2600 + i * 1100));
})();
</script>
</body>
</html>
